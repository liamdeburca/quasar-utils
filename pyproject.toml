[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2", "Cython>=3.0", "numpy>=1.26"]
build-backend = "setuptools.build_meta"

[project]
name = "quasar-utils"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.0.0",
    "lazy_imports>=1.0.0",
    "quasar-typing",
    "astropy>=7.0",
    "pydantic>=2.12",
    "numpy>=1.26",
    "scipy>=1.16",
    "cython==3.0.12",
    "dustmaps==1.0.14",
    "healpy==1.19.0",
    "cachetools>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/liamdeburca/quasar-utils"
Repository = "https://github.com/liamdeburca/quasar-utils.git"
"Bug Tracker" = "https://github.com/liamdeburca/quasar-utils/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[lint.pyupgrade]
keep-runtime-typing = true