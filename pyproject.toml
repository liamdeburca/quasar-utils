[build-system]
requires = [
    "wheel", 
    "setuptools==72.1.0",
    "Cython==3.0.12", 
    "numpy==1.26",
]
build-backend = "setuptools.build_meta"

[project]
name = "quasar-utils"
authors = [{name = "Liam", email = "liam_deburca@me.com"}]
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "quasar-typing==0.1.0",

    "pydantic==2.12",
    "astropy==7.0",
    "dustmaps==1.0.14",
    "healpy==1.19.0",
    "numpy==1.26",
    "scipy==1.16",
    "lazy-imports==1.2.0",
    "cachetools==7.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "black==26.10.1",
    "isort==9.0.2",
]

[project.urls]
Homepage = "https://github.com/liamdeburca/quasar-utils"
Repository = "https://github.com/liamdeburca/quasar-utils.git"
"Bug Tracker" = "https://github.com/liamdeburca/quasar-utils/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[lint.pyupgrade]
keep-runtime-typing = true